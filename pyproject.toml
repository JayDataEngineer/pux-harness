[project]
name = "pux-harness"
version = "0.1.0"
description = "deepagents-based Pux harness — the org+skill compiler (slim kit) + the Docker sandbox runtimes."
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents-context",
    "deepagents>=0.7.3",
    "deepagents-acp>=0.0.9",
    "docker>=7.1.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "anthropic>=0.100",
    "langchain-anthropic>=1.5.3",
    "langchain-openai",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pyyaml",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.49.0",
    "deepagents-code",
    "ag-ui-langgraph",
    "fastmcp>=3.4.2",
    "langchain-quickjs>=0.3.5",
]

# Optional extras — the base install stays lean. The Python-import extras
# (observability, upstream) are guarded imports (see agent/observability.py):
# the harness runs identically with or without. The ``prod`` extra is different —
# a separate runtime binary (aegra) the prod launcher opts into (see below).
[project.optional-dependencies]
observability = ["langfuse>=3.0"]
upstream = [
    "langgraph-cli[inmem]>=0.4.30",
]
# Aegra — the OSS langgraph-api/LangGraph-Platform drop-in that serves the
# Agent Protocol HTTP surface in production (see docs/AEGRA_PROD.md). A separate
# binary, not a guarded import: the PyPI distribution is ``aegra-cli`` (which
# ships the ``aegra`` console command — do NOT confuse with the unrelated PyPI
# ``aegra`` package, capped at 0.2.0). Kept out of the base install so consumers
# of the slim kit don't pull postgres/redis/sqlalchemy/structlog. The prod
# launcher (scripts/start_pux_aegra.sh) opts in with ``uv run --extra prod`` —
# which installs on first start AND self-heals after any bare ``uv sync`` (a bare
# sync prunes undeclared packages; ``--extra prod`` re-declares aegra-cli into the
# sync set so every prod start re-installs it). Mirror of how ``upstream`` scopes
# the langgraph-cli keystone lane.
prod = [
    "aegra-cli>=0.9.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pux = "pux_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pux_harness"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.pytest.ini_options]
# The harness repo's own suite: the slim-kit compiler + the org-agnostic
# machinery (registry, browser-JS, reasoning adapter, model resolver). Tests
# that need a real ``orgs/`` tree live in the CONSUMER repo (the orchestrator),
# which installs pux-harness and exercises it against real orgs.
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"

# uv workspace — the ``deepagents-context`` sub-package is a standalone,
# independently-publishable distribution extracted from the context cluster.
# pux depends on it via the workspace; when published to PyPI, replace
# ``"deepagents-context"`` above with ``"deepagents-context>=0.1.0"``.
[tool.uv.workspace]
members = ["packages/deepagents-context"]

[tool.uv.sources]
deepagents-context = { workspace = true }
