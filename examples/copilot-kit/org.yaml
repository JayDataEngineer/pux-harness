# Example base org — the co-pilot kit.
#
# A consumer app extends this to inherit this roster + the AGENTS.md prompt +
# the profile below, then specializes by adding its own agents / prompt /
# policy.
#
# Roster ships one generalist specialist a co-pilot app needs out of the box.
# `agents:` is the chain-inherited roster — a child's own `agents:`
# is unioned on top of this.
agents:
  - copilot-helper
