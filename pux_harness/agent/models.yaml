# The model spec — single source of truth for which model fills each role.
#
# WHY THIS FILE EXISTS
#   No model id is hardcoded anywhere else in the harness. Every consumer asks
#   `get_model(role=..., org=...)` (harness/pux_harness/agent/model.py) and this
#   file decides which concrete model id that role resolves to + which PROVIDER
#   PROFILE serves it. A cloner repoints at their own provider by editing THIS
#   FILE (or overriding per-org in orgs/<name>/profile.yaml under `models:`, or
#   per-subagent in an agent's frontmatter `model:`). One file, no code edits,
#   no scattered hardcodes.
#
# RESOLUTION ORDER for a role (highest priority first)
#   1. subagent frontmatter `model:`   — agent-level (subagents only; a literal id)
#   2. org profile.yaml `models:` map  — org-level role override. Literal id OR
#                                        @role cross-reference (e.g. `@worker`
#                                        resolves to the tier's worker_model —
#                                        decouples the org from a literal id).
#   3. env PUX_<ROLE>_MODEL             — deployment-level (e.g. PUX_GRADER_MODEL)
#   4. the ACTIVE TIER's role map below — selected by --tier/--fast (sets PUX_TIER),
#                                         defaulting to `default_tier`
#
# THE PROVIDER PROFILES (`providers:` + `default_provider:`)
#   Named profiles, each pinning a wire PROTOCOL (`kind: openai` | `anthropic`),
#   an OpenAI- or Anthropic-compatible `base_url`, and the env var holding the
#   api key. A MODEL ID is bound to a profile in the `models:` registry
#   (`provider: <name>`); ids without an explicit profile use `default_provider`.
#   This is how one deployment can serve models from DIFFERENT vendors/protocols
#   at once. (Shipped: glm-5.2/glm-5.1 ride `zai-coding` — ZAI's GLM Coding Plan
#   OpenAI endpoint — billed against the coding subscription; the cheap ids ride
#   `openrouter`. Both are OpenAI-compatible, so
#   reasoning streams uniformly as the OpenAI `delta.reasoning_content` shape that
#   `ReasoningChatOpenAI` captures → ACP thoughts for the DEFAULT supervisor with
#   no Anthropic extractor. `zai-anthropic` is kept as an available profile; see
#   its comment for why the shipped deployment does NOT route glm-5.2 through it.)
#   No code edits, no per-model hardcodes: add a profile here, tag the id, done.
#
# THE ROLES (the keys inside every tier)
#   base_model       the primary driving agent (the CTO / supervisor). The shipped
#                    DEFAULT tier uses glm-5.2 (SOTA text reasoning) so the driving
#                    agent thinks hard. `--fast` / the `fast` tier cheapens it to
#                    mimo-v2.5 for rate-limit fallback or trivial tasks.
#   worker_model     default for subagents/specialists whose frontmatter omits
#                    `model:`. Decoupled from base so an org can set base!=worker
#                    (the default tier pairs a SOTA supervisor with cheap workers —
#                    exactly the smart-coordinator / cheap-doers split the dynamic-
#                    subagent happy path assumes).
#   multimodal_model vision — the model `describe_image` / `multimodal` route to.
#                    MUST be a multimodal-capable id (see the `models:` registry) —
#                    a non-multimodal driver falls back to calling `describe_image`
#                    (which uses THIS role) rather than reading image blocks itself.
#   grader_model     the RubricMiddleware verify-gate grader. Runs up to
#                    max_iterations × per agent output, so the CHEAP model is the
#                    right default; bump per-org where a rubric needs more reasoning.
#
# THE FALLBACK CHAINS (OPTIONAL, the `<role>_fallbacks` keys inside a tier)
#   A list of model ids `get_model` wraps via LangChain `with_fallbacks`: when the
#   primary `<role>_model` raises a TRANSIENT error (429 / timeout / 5xx) that
#   exhausts its own max_retries, the call fails over to the next id in the list.
#   Declared + WARNING-logged — NOT a silent swap (a 401/400/404 config bug dies
#   loud instead of burning the chain). Applies ONLY when the role resolved from
#   the tier; an explicit override (frontmatter / org `models:` / PUX_<ROLE>_MODEL)
#   is a HARD pin — no failover. Each fallback MUST share the primary's PROVIDER
#   KIND (a chain is protocol-homogeneous — glm-5.2 -> glm-5.1 are both
#   `zai-anthropic`; you cannot chain an Anthropic id onto an OpenAI primary).
#   Keep it shallow — every entry is another model tried in series.
#
# THE `models:` REGISTRY
#   Per-id flags + provider binding. `multimodal:` is the capability flag
#   (`is_multimodal(id)` reads it; UNKNOWN ids default to non-multimodal — the
#   fail-safe path). `provider:` names a profile in `providers:` (or the
#   `default_provider` when absent). The DEFAULT tier's multimodal_model must be
#   flagged true here.
#   `strength:` is the orchestration-strength class — `pro` (a strong
#   orchestrator, smart enough to drive the dynamic-subagent happy path via
#   `CodeInterpreterMiddleware`) or `flash` (a cheap/worker model that should
#   NOT auto-mount that happy path). `is_strong_orchestrator(id)` /
#   `driver_strong_orchestrator(role=, org=)` read it; UNKNOWN ids default to
#   `flash` (fail-safe: a model of unknown strength gets NO interpreter, so a
#   weak orchestrator never wastes tokens on a tool it can't drive reliably).
#   The dynamic happy path auto-mounts iff the `base` role resolves to a `pro`
#   id (shipped: glm-5.2/glm-5.1); `middleware.supervisor.add: [interpreter]`
#   overrides it ON per-org, `remove` OFF. Set once here — the single source.
#   `reasoning_effort:` is the OpenAI reasoning-depth knob (e.g. low/high/max),
#   honored by reasoning-capable OpenAI-kind models. `reasoning_effort_for(id)`
#   reads it and `_instantiate` threads it as OpenAI `extra_body` → the model
#   thinks at that depth. An unset/absent flag sends NO extra_body (the model's
#   own default). `PUX_REASONING_EFFORT` overrides per-deployment. openai-kind
#   only (it's an OpenAI extension).
#
# THE `dcode:` BLOCK
#   The TUI (dcode) names our endpoint `pux-openai` and uses the SAME ids (see
#   ~/.deepagents/config.toml). `pux tui` forwards the resolved base model as
#   `<dcode.provider>:<id>` so dcode never falls back to its own default.

# Named provider profiles — each a wire protocol + endpoint + key env.
providers:
  # OpenRouter — OpenAI-compatible aggregator. Primary serving backend. Serves
  # the mimo/kimi/deepseek ids (full upstream ids via each id's `wire_id`). Force
  # a specific backend (e.g. Parasail) with PUX_OPENROUTER_PROVIDER_ONLY in .env
  # — see _instantiate in
  # agent/model.py. Same OPENROUTER_API_KEY as Athena.
  openrouter:
    kind: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 8192
    temperature: 0.2
  # ZAI — GLM Coding Plan, OpenAI-compatible endpoint. This is where the coding
  # subscription lives (glm-5.2/glm-5.1 bill here). Verified 07-10: streams full
  # reasoning as `delta.reasoning_content` (ReasoningChatOpenAI captures it → ACP
  # thoughts) and honors `reasoning_effort` (high/max) via extra_body. Auth reuses
  # the same ANTHROPIC_AUTH_TOKEN that works on ZAI's Anthropic endpoint.
  # NOTE the two /paas/v4 URLs are NOT the same: `/api/paas/v4` is the STANDARD
  # pay-as-you-go endpoint — it returns code 1113 "insufficient balance" for this
  # token (verified dead 07-10); `/api/coding/paas/v4` (below) is the CODING-PLAN
  # endpoint and is the one that works.
  zai-coding:
    kind: openai
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ANTHROPIC_AUTH_TOKEN
    max_tokens: 8192
    temperature: 0.2
  # ZAI — Anthropic-compatible endpoint. AVAILABLE but UNUSED by the shipped
  # deployment: glm-5.2/glm-5.1 route through `zai-coding` (the OpenAI-shape
  # coding endpoint) instead so reasoning streams as delta.reasoning_content.
  # Kept for a cloner who prefers the Anthropic protocol / has live ZAI Anthropic
  # balance — repoint a model's `provider:` here to use it. Same ANTHROPIC_AUTH_TOKEN.
  zai-anthropic:
    kind: anthropic
    base_url: https://api.z.ai/api/anthropic
    api_key_env: ANTHROPIC_AUTH_TOKEN
    max_tokens: 8192
    temperature: 0.2

# Profile used by model ids that don't name one in `models:`. openrouter is the
# live default.
default_provider: openrouter

# Per-id registry: capability flag + which profile serves it.
models:
  glm-5.2:           {provider: zai-coding, multimodal: false, strength: pro, reasoning_effort: max}
  glm-5.1:           {provider: zai-coding, multimodal: false, strength: pro, reasoning_effort: max}
  mimo-v2.5:         {provider: openrouter, wire_id: xiaomi/mimo-v2.5, multimodal: true, strength: flash}
  mimo-v2.5-pro:     {provider: openrouter, wire_id: xiaomi/mimo-v2.5-pro, multimodal: true, strength: flash}
  kimi-k2.7-code:    {provider: openrouter, wire_id: moonshotai/kimi-k2.7-code, multimodal: false, strength: flash}
  kimi-k2.6:         {provider: openrouter, wire_id: moonshotai/kimi-k2.6, multimodal: false, strength: flash}
  deepseek-v4-pro:   {provider: openrouter, wire_id: deepseek/deepseek-v4-pro, multimodal: false, strength: flash}
  deepseek-v4-flash: {provider: openrouter, wire_id: deepseek/deepseek-v4-flash, multimodal: false, strength: flash}

# Named tiers — a coherent role map per "mode". `default_tier` is the shipped
# default; --tier <name> (or --fast) selects another at run time.
tiers:
  # The shipped happy path: a SOTA text-reasoning supervisor driving cheap
  # (multimodal) workers. glm-5.2 is NOT multimodal, so the supervisor reaches
  # vision through `describe_image` (-> multimodal_model) via the
  # BrowserVisionMiddleware text-pointer fallback, not native image blocks.
  default:
    base_model: glm-5.2
    # glm-5.2 (zai-coding, kind: openai) -> mimo-v2.5-pro (openrouter, kind:
    # openai): cross-provider escape — when ZAI's coding-plan rate-limit window
    # is exhausted, fail over to OpenRouter. Both are OpenAI-compatible, so the
    # chain stays protocol-homogeneous. Reasoning streams uniformly as
    # delta.reasoning_content regardless of which provider serves the turn.
    base_fallbacks: [mimo-v2.5-pro]
    worker_model: mimo-v2.5
    multimodal_model: mimo-v2.5
    grader_model: mimo-v2.5
  # Everything cheap — opt in with --fast (or PUX_TIER=fast) for rate-limit
  # fallback or trivial tasks. mimo-v2.5 is multimodal, so even here the driver
  # reads browser screenshots natively.
  fast:
    base_model: mimo-v2.5
    worker_model: mimo-v2.5
    multimodal_model: mimo-v2.5
    grader_model: mimo-v2.5

default_tier: default

# dcode (the TUI) provider name for the endpoint — see the block comment.
dcode:
  provider: pux-openai
